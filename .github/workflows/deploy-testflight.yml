name: Deploy to TestFlight

# v로 시작하는 태그를 푸시하면 자동 배포 (예: git tag v2.1.0 && git push origin v2.1.0)
# 또는 Actions 탭에서 수동 실행(workflow_dispatch)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_number:
        description: "빌드 번호 (비우면 날짜 기반 자동 생성)"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Archive & Upload
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      # App Store Connect API 키 배치 (Secrets: ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8)
      - name: Set up App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      # 빌드 번호: 수동 입력값 > 날짜 기반(YYYYMMDDHHMM, 항상 증가)
      - name: Determine build number
        id: buildnum
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "value=${{ github.event.inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ReToU.xcodeproj \
            -scheme ReToU \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ReToU.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.buildnum.outputs.value }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tail -40

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>T6245YXX47</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ReToU.xcarchive \
            -exportPath build/upload \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tail -20

      - name: Summary
        run: |
          echo "### 🚀 TestFlight 업로드 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "- 빌드 번호: ${{ steps.buildnum.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 트리거: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 처리 완료까지 5~30분 뒤 App Store Connect > TestFlight에서 확인" >> "$GITHUB_STEP_SUMMARY"
